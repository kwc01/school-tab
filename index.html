<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校ポータル</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f2f5f9;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 30px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .link-button {
      display: block;
      padding: 25px 15px;
      background: white;
      border-radius: 12px;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .link-button:hover {
      background: #eff6ff;
    }
  </style>
</head>

<body>

  <header>
    <h1>○○学校ポータル</h1>
    <p>学校便利リンク</p>
  </header>

  <main>

    <h2>便利なリンク</h2>

    <div class="links">

      <a class="link-button"
         href="https://www.google.com/"
         target="_blank">
        Google
      </a>

      <a class="link-button"
         href="https://classroom.google.com/"
         target="_blank">
        Google Classroom
      </a>

      <a class="link-button"
         href="https://www.youtube.com/"
         target="_blank">
        YouTube
      </a>

      <a class="link-button"
         href="https://www.google.co.jp/"
         target="_blank">
        Google検索
      </a>

    </div>

  </main>

</body>
</html>
